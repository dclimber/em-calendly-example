name: em_calendly_example
description: Internal meeting scheduler, generated from an Event Modeling HCL model with fmodel, fstore-sql, Supabase, and Jaspr.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  fmodel: ^0.1.0
  googleapis: ^18.0.0
  googleapis_auth: ^2.3.7
  http: ^1.6.0
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0
  logging: ^1.3.0
  mailer: ^7.3.0
  postgres: ^3.6.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^6.1.0
  test: ^1.31.1

jaspr:
  mode: server
